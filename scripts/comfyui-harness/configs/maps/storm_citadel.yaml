meta:
  id: storm_citadel
  name: "폭풍의 성채"
  theme: "floating storm citadel, lightning, dark purple clouds, arcane energy"

style:
  prompt_prefix: "pixel art, isometric view, 45 degree angle, storm citadel, dark clouds"
  negative: "blurry, modern, sci-fi, neon, realistic, photorealistic, 3D render, smooth gradients, anti-aliased"
  palette:
    primary: ["#2a2a4a", "#1a1a3a", "#2040a0"]
    accent: ["#4060c0", "#8060e0", "#a080ff"]
    highlight: ["#f0e060", "#ffffff", "#c0c0ff"]
  seed: 256

generation:
  checkpoint: "dreamshaper_8.safetensors"
  steps: 25
  cfg_scale: 7
  width: 512
  height: 512

animation:
  motion_module: "mm_sd_v15_v2.ckpt"
  frames: 8
  fps: 14

output:
  base_size: 128
  format: "png"
  spritesheet: true

assets:
  terrain:
    - id: cloud-floor
      prompt: "cloud floor tile, seamless, dense dark purple storm clouds, faint electric shimmer, swirling mist texture"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: arcane-path
      prompt: "arcane stone path tile, seamless, dark blue-purple stone etched with glowing runes, faint magical energy pulse"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: void-tile
      prompt: "void tile, seamless, deep dark space between floating platforms, faint purple energy wisps, starless abyss"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: storm-vortex
      prompt: "storm vortex tile, swirling purple-blue storm clouds with crackling lightning at center, violent rotation"
      frames: 8

  structures:
    - id: lightning-rod
      prompt: "tall iron lightning rod, crackling electricity arcing around the tip, bright white-yellow discharge, continuous storm energy"
      frames: 8

    - id: crystal-arch
      prompt: "towering crystal archway, deep purple translucent crystal, arcane runes carved into surface, faint inner glow"
      frames: 1
      size: 256

    - id: floating-platform
      prompt: "floating stone platform, dark blue-gray rock suspended in storm clouds, crackling electrical aura underneath, slowly drifting"
      frames: 4

    - id: storm-tower
      prompt: "massive storm citadel tower, dark stone with purple arcane windows, lightning cresting at the top, imposing fortification"
      frames: 1
      size: 256

    - id: runic-pillar
      prompt: "stone pillar covered in glowing arcane runes, dark surface with pulsing blue-purple inscriptions, magical energy emanating"
      frames: 4

    - id: chain-bridge
      prompt: "iron chain bridge between floating platforms, heavy chains anchored to dark stone, swaying slightly in storm winds"
      frames: 1
      size: 256

  decorations:
    - id: spark-cluster
      prompt: "cluster of electrical sparks, bright white-yellow lightning arcs jumping between small conductor orbs, rapid flickering"
      frames: 8

    - id: arcane-rune
      prompt: "arcane rune carved in stone, glowing blue-purple light pulsing outward, magical inscription brightening and dimming"
      frames: 4

    - id: cloud-wisp
      prompt: "small cloud wisp, dark purple ethereal cloud tendril drifting through air, faint electric glow within the mist"
      frames: 8

    - id: shattered-crystal
      prompt: "shattered purple arcane crystal, fractured pieces scattered on ground, residual magical glow fading from broken facets"
      frames: 1

    - id: energy-orb
      prompt: "floating arcane energy orb, swirling blue-purple magical sphere, crackling outer surface, intense core glow pulsing"
      frames: 8
