meta:
  id: forest_gate
  name: "숲의 관문"
  theme: "medieval fantasy forest, lush green canopy, moss-covered stone"

style:
  prompt_prefix: "pixel art, isometric view, 45 degree angle, medieval fantasy forest"
  negative: "blurry, modern, sci-fi, neon, realistic, photorealistic, 3D render, smooth gradients, anti-aliased"
  palette:
    primary: ["#2d5a1e", "#4a7a2e", "#6b9e3a", "#1e5a10", "#2d7a1e"]
    accent: ["#8b6914", "#a0522d", "#654321", "#8b5e3c", "#5a3a1e"]
    highlight: ["#c8e6c9", "#f5f5dc", "#8ada60", "#6abe48"]
  seed: 42

generation:
  checkpoint: "dreamshaper_8.safetensors"
  steps: 25
  cfg_scale: 7
  width: 512
  height: 512

animation:
  motion_module: "mm_sd_v15_v2.ckpt"
  frames: 8
  fps: 14

output:
  base_size: 128
  format: "png"
  spritesheet: true

assets:
  terrain:
    - id: grass-floor
      prompt: "grass floor tile, seamless, dark green texture, subtle dirt patches"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: dirt-path
      prompt: "worn dirt path, stone edges, footprints, earthy brown"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: stone-floor
      prompt: "cobblestone floor tile, seamless, gray with moss between cracks"
      frames: 1
      tileable: true
      workflow_override: tileable

    - id: water-shallow
      prompt: "shallow water tile, clear with visible pebbles, gentle ripples"
      frames: 8

  structures:
    - id: oak-tree-large
      prompt: "large oak tree, thick trunk, swaying leaves, rich green canopy"
      frames: 8
      size: 256

    - id: pine-tree
      prompt: "tall pine tree, dark green needles, narrow shape"
      frames: 4

    - id: stone-wall
      prompt: "mossy stone wall segment, ivy growing, weathered cracks"
      frames: 1

    - id: wooden-fence
      prompt: "wooden fence section, rough planks, slightly crooked"
      frames: 1

    - id: stone-bridge
      prompt: "small stone bridge, arched, moss-covered, over water"
      frames: 1
      size: 256

    - id: guard-tower
      prompt: "wooden guard tower, watchtower platform, pointed roof, flag"
      frames: 1
      size: 256

  decorations:
    - id: mushroom-cluster
      prompt: "glowing mushroom cluster, bioluminescent, blue-green glow"
      frames: 4

    - id: flower-patch
      prompt: "wildflower patch, small colorful flowers, grass base"
      frames: 4

    - id: rock-pile
      prompt: "pile of mossy rocks, small boulders, gray-green"
      frames: 1

    - id: fallen-log
      prompt: "fallen tree log, mossy, broken end, forest floor"
      frames: 1

    - id: lantern-post
      prompt: "iron lantern on wooden post, warm orange glow, flickering"
      frames: 8

    - id: bush-berry
      prompt: "berry bush, red berries, green leaves, round shape"
      frames: 1
