name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate assets
        run: bun run scripts/generate-assets/generate-all.ts

      - name: Build
        run: bun build:web

      - name: Check bundle size
        run: |
          MAX_SIZE_KB=2048
          DIST_SIZE=$(du -sk packages/web-shell/dist | cut -f1)
          echo "Bundle size: ${DIST_SIZE}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE_KB" ]; then
            echo "::error::Bundle size ${DIST_SIZE}KB exceeds budget of ${MAX_SIZE_KB}KB"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/web-shell/dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate assets
        run: bun run scripts/generate-assets/generate-all.ts

      - name: Build
        run: bun build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/web-shell/dist --project-name=gld-pvp
