<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7ab648" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Palace 개랜타디" />
    <meta name="description" content="1:1 개인 랜덤 타워디펜스 - 랜덤 구매 + 합성 + 킬 트랜스퍼" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" integrity="sha384-55uQGdclWjXwWY0yHikdtcfcat9pPBqMBCVFIeWjRhvPPUYbpJLhIJegzTcFoh/A" crossorigin="anonymous" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <title>Palace 개랜타디</title>
  </head>
  <body>
    <!-- Colorblind correction SVG filters -->
    <div style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="protan-filter">
            <feColorMatrix type="matrix" values="
              0.567 0.433 0     0 0
              0.558 0.442 0     0 0
              0     0.242 0.758 0 0
              0     0     0     1 0"/>
          </filter>
          <filter id="deutan-filter">
            <feColorMatrix type="matrix" values="
              0.625 0.375 0     0 0
              0.7   0.3   0     0 0
              0     0.3   0.7   0 0
              0     0     0     1 0"/>
          </filter>
          <filter id="tritan-filter">
            <feColorMatrix type="matrix" values="
              0.95 0.05  0      0 0
              0    0.433 0.567  0 0
              0    0.475 0.525  0 0
              0    0     0      1 0"/>
          </filter>
        </defs>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
