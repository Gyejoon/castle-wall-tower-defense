meta:
  id: towers
  name: "타워 에셋"

style:
  prompt_prefix: "pixel art, isometric view, 45 degree angle, medieval fantasy tower, grass and stone theme, 2.5D depth shading, small shadow at base"
  negative: "blurry, modern, sci-fi, neon, realistic, photorealistic, 3D render, smooth gradients, anti-aliased"
  palette:
    primary: ["#c8a04a", "#8b5e3c", "#5bc8e8", "#f0e080", "#302040", "#a8def0", "#8b4513", "#8c8c8c", "#2a1f0a"]
    accent: ["#e0b020", "#e07020", "#c03020", "#4060e0", "#f0d060", "#a8def0", "#5bc8e8", "#c040d0"]
  seed: 42

generation:
  checkpoint: "dreamshaper_8.safetensors"
  steps: 25
  cfg_scale: 7
  width: 512
  height: 512

animation:
  motion_module: "mm_sd_v15_v2.ckpt"
  frames: 8
  fps: 14

output:
  base_size: 128
  format: "png"
  spritesheet: true

assets:
  towers:
    # === laser — Wooden Archer Tower ===
    - id: laser
      prompt: "wooden archer tower with bow mounted on top, golden brown wood planks, single tower on grass base, quiver of arrows visible, pointed roof, centered, idle"
      frames: 1

    - id: laser-fire
      prompt: "wooden archer tower attacking, arrow launching from bow, arrow in flight, muzzle flash of released bowstring, golden brown wood, dynamic tension"
      frames: 8

    # === plasma — Stone Catapult ===
    - id: plasma
      prompt: "stone catapult siege weapon, dark brown aged wood frame, gray stone counterweight, rope tension visible, solid stone base, centered, idle"
      frames: 1

    - id: plasma-fire
      prompt: "stone catapult releasing, arm swinging up, boulder projectile launching, rope snapping, dark brown wood frame shaking, debris dust, dynamic launch"
      frames: 8

    # === emp — Ice Crystal Tower ===
    - id: emp
      prompt: "ice blue crystal tower, jagged frost crystals growing upward, pale icy glow, frost magic aura, snow-dusted stone base, centered, idle"
      frames: 1

    - id: emp-fire
      prompt: "ice crystal tower attacking, burst of frost magic, ice shards launching outward, freezing beam, icy blue glow intensifying, snowflake explosion"
      frames: 8

    # === shield — Holy Altar ===
    - id: shield
      prompt: "golden holy altar tower, warm yellow glowing shield dome, carved stone pillar, holy runes etched into sides, soft divine light radiating, centered, idle"
      frames: 1

    - id: shield-fire
      prompt: "holy altar activating shield, golden barrier expanding outward, divine light pulse, glowing runes flashing, warm radiant burst, protective energy wave"
      frames: 8

    # === twin_laser — Twin Crossbow Turret ===
    - id: twin_laser
      prompt: "twin crossbow turret, two reinforced crossbows mounted side by side, iron and dark wood construction, rotating platform base, bolts loaded, centered, idle"
      frames: 1

    - id: twin_laser-fire
      prompt: "twin crossbow turret firing both bolts simultaneously, dual bolts launching, double muzzle flash, iron frame recoiling, smoke trails"
      frames: 8

    # === disruptor — Dark Purple Crystal Tower ===
    - id: disruptor
      prompt: "dark purple crystal tower, jagged shadow magic crystals, ominous violet glow, corrupted stone base, dark aura emanating, centered, idle"
      frames: 1

    - id: disruptor-fire
      prompt: "dark purple crystal tower casting shadow magic, purple energy blast launching, dark void beam, shadow tendrils, ominous violet explosion, corrupted energy"
      frames: 8

    # === nova_cannon — Large Trebuchet ===
    - id: nova_cannon
      prompt: "large trebuchet siege engine, massive wooden arm with heavy stone counterweight, thick rope and pulley system, reinforced oak frame, heavy stone base, centered, idle"
      frames: 1

    - id: nova_cannon-fire
      prompt: "large trebuchet launching, massive arm swinging full arc, heavy boulder soaring, ropes straining, wooden frame shaking, tremendous impact force, dust cloud"
      frames: 8

    # === fortress — Miniature Castle Keep ===
    - id: fortress
      prompt: "miniature castle keep, crenellated battlements, stone tower with arrow slits, small flag waving on top, thick defensive walls, centered, idle"
      frames: 1

    - id: fortress-fire
      prompt: "miniature castle keep defending, volleys of arrows from battlements, crossbows firing from arrow slits, flag waving, multiple projectiles launching outward"
      frames: 8

    # === stasis_field — Frozen Ice Shrine ===
    - id: stasis_field
      prompt: "frozen ice shrine, pale blue translucent crystals arranged in snowflake pattern, frost-covered stone altar, soft cold luminescence, icy mist at base, centered, idle"
      frames: 1

    - id: stasis_field-fire
      prompt: "frozen ice shrine activating stasis field, expanding ring of frost, time-freeze pulse, pale blue wave emanating outward, snowflake burst, enemies encased in ice"
      frames: 8
