meta:
  id: bosses
  name: "보스 에셋"

style:
  prompt_prefix: "pixel art, isometric view, 45 degree angle, epic boss monster"
  negative: "blurry, modern, cute, chibi, simple"

generation:
  checkpoint: "dreamshaper_8.safetensors"
  steps: 35
  cfg_scale: 8

animation:
  frames: 8
  fps: 12

output:
  base_size: 256

assets:
  bosses:
    - id: titan-dragon
      prompt: "ancient fire dragon, massive wings, scales glowing with ember, fearsome"
      workflow_override: boss
      animations:
        - { state: idle, prompt_suffix: "idle stance, wings folded, breathing smoke" }
        - { state: attack, prompt_suffix: "fire breath attack, wings spread wide" }
        - { state: phase2, prompt_suffix: "enraged, glowing red cracks on scales, fury" }
        - { state: death, prompt_suffix: "collapsing, fading to embers, dissolving" }

    - id: storm-lord
      prompt: "lightning elemental, crackling electricity, swirling storm aura, towering"
      workflow_override: boss
      animations:
        - { state: idle, prompt_suffix: "dormant stance, slow arc lightning, hovering" }
        - { state: attack, prompt_suffix: "discharging massive lightning bolt, arms raised" }
        - { state: phase2, prompt_suffix: "overcharged, body exploding with arcs, frenzied" }
        - { state: death, prompt_suffix: "dissipating, sparks scattering, flickering out" }

    - id: lava-golem
      prompt: "molten rock golem, glowing magma cracks, obsidian shell, massive fists"
      workflow_override: boss
      animations:
        - { state: idle, prompt_suffix: "dormant stance, lava slowly oozing, smoldering" }
        - { state: attack, prompt_suffix: "smashing ground, magma erupting, fist slam" }
        - { state: phase2, prompt_suffix: "cracking apart, inner lava exposed, blazing fury" }
        - { state: death, prompt_suffix: "shattering, cooling stone, magma dimming" }
