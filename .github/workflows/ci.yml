name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun build:web

      - name: Check bundle size
        run: |
          # Budget history:
          #   2048KB — pre-ranking baseline
          #   2200KB — +@supabase/supabase-js (~200KB, auth + postgrest + realtime + storage)
          #            for global ranking feature; split to own chunk via manualChunks
          MAX_SIZE_KB=2200
          DIST_SIZE=$(find packages/web-shell/dist/web -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) ! -name '*.map' ! -name 'sw.js' ! -name 'workbox-*.js' -print0 | xargs -0 wc -c | tail -1 | awk '{print int($1/1024)}')
          echo "Bundle size (JS/CSS/HTML): ${DIST_SIZE}KB (budget: ${MAX_SIZE_KB}KB)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE_KB" ]; then
            echo "::error::Bundle size ${DIST_SIZE}KB exceeds budget of ${MAX_SIZE_KB}KB"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dist
          path: packages/web-shell/dist/
          retention-days: 7

  # Deploy is handled by Vercel GitHub integration (auto-deploys on push to main)
